<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDYSMART - Exam Planner & Revision Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [exams, setExams] = useState([
                {
                    id: '1',
                    subject: 'Mathematics',
                    examName: 'Mid-Term Algebra Exam',
                    date: '2026-06-15',
                    time: '09:00 AM',
                    syllabus: 'Quadratic Equations, Polynomials, Limits',
                    revisionPlan: [
                        { dayNumber: 1, date: '2026-06-08', topic: 'Quadratic Equations basics', done: true },
                        { dayNumber: 2, date: '2026-06-09', topic: 'Polynomial factorization', done: false }
                    ]
                }
            ]);

            const [showAddModal, setShowAddModal] = useState(false);
            const [subject, setSubject] = useState('Mathematics');
            const [examName, setExamName] = useState('');
            const [examDate, setExamDate] = useState(() => {
                const d = new Date();
                d.setDate(d.getDate() + 10);
                return d.toISOString().split('T')[0];
            });
            const [examTime, setExamTime] = useState('09:00 AM');
            const [syllabus, setSyllabus] = useState('');

            const subjectsList = ['Mathematics', 'Physics', 'Chemistry', 'Computer Science'];

            const getDaysLeft = (targetDateStr) => {
                const target = new Date(targetDateStr).getTime();
                const today = new Date().getTime();
                return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            };

            const toggleRevisionDayDone = (examId, dayNumber) => {
                setExams(exams.map(exam => {
                    if (exam.id !== examId) return exam;
                    return {
                        ...exam,
                        revisionPlan: exam.revisionPlan.map(day => 
                            day.dayNumber === dayNumber ? { ...day, done: !day.done } : day
                        )
                    };
                }));
            };

            const deleteExam = (examId) => {
                setExams(exams.filter(e => e.id !== examId));
            };

            const handleCreateExam = (e) => {
                e.preventDefault();
                if (!examName.trim()) return;

                const rawTopics = syllabus.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean);
                const defaultTopics = rawTopics.length > 0 ? rawTopics : [
                    'Fundamental Concepts',
                    'Key Formulas & Proofs',
                    'Problem Sets',
                    'Doubts Clarification',
                    'Previous Year Papers',
                    'Mock Exam'
                ];

                const generatedPlan = defaultTopics.map((topic, i) => {
                    const revDate = new Date();
                    revDate.setDate(revDate.getDate() + i + 1);
                    return {
                        dayNumber: i + 1,
                        date: revDate.toISOString().split('T')[0],
                        topic,
                        done: false
                    };
                });

                setExams([{
                    id: Date.now().toString(),
                    subject,
                    examName: examName.trim(),
                    date: examDate,
                    time: examTime,
                    syllabus: syllabus.trim() || 'General Course Syllabus',
                    revisionPlan: generatedPlan
                }, ...exams]);

                setExamName('');
                setSyllabus('');
                setShowAddModal(false);
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-6 pb-12">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b pb-4 border-slate-200">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">🏆</span>
                                <h1 className="text-2xl sm:text-3xl font-black text-slate-800">
                                    Exam Planner &amp; Revision Guide
                                </h1>
                            </div>
                            <p className="text-xs sm:text-sm text-slate-500 font-semibold mt-1">
                                Day-by-day revision schedule &bull; STUDYSMART
                            </p>
                        </div>

                        <button
                            onClick={() => setShowAddModal(true)}
                            className="px-4 py-2.5 rounded-xl bg-purple-700 hover:bg-purple-800 text-white text-xs sm:text-sm font-bold shadow transition"
                        >
                            + Add Exam &amp; Plan
                        </button>
                    </div>

                    <div className="space-y-6">
                        {exams.length === 0 ? (
                            <div className="bg-white rounded-3xl p-10 text-center border border-purple-100 shadow-sm">
                                <p className="font-bold text-slate-700">No upcoming exams added</p>
                                <button
                                    onClick={() => setShowAddModal(true)}
                                    className="mt-4 px-4 py-2 rounded-xl bg-purple-100 text-purple-900 font-bold text-xs"
                                >
                                    Add First Exam
                                </button>
                            </div>
                        ) : (
                            exams.map((exam) => {
                                const daysLeft = getDaysLeft(exam.date);
                                const completedCount = exam.revisionPlan.filter((p) => p.done).length;
                                const totalPlan = exam.revisionPlan.length;
                                const progress = totalPlan > 0 ? Math.round((completedCount / totalPlan) * 100) : 0;

                                return (
                                    <div key={exam.id} className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-purple-100 space-y-4">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-purple-100">
                                            <div>
                                                <span className="text-xs font-bold bg-purple-100 text-purple-800 px-2.5 py-0.5 rounded-md">
                                                    {exam.subject}
                                                </span>
                                                <h3 className="text-lg sm:text-xl font-black text-slate-800 mt-1">
                                                    {exam.examName}
                                                </h3>
                                                <p className="text-xs text-slate-500 font-semibold mt-0.5
